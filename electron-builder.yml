appId: com.electron.app
productName: my-daw
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# The sample pack that ships with the app is read by the main process at runtime,
# so it has to be real files rather than entries inside the asar. Moving this
# means moving `bundledSamplesDir()` in src/main/index.ts with it.
asarUnpack:
  - resources/**
win:
  executableName: my-daw
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Ask where to install, rather than picking for the user.
  #
  # NSIS builds a one-click installer by default: it unpacks straight to
  # %LOCALAPPDATA%\Programs and is over before there is anything to click. Asking
  # for a directory means giving that up — `allowToChangeInstallationDirectory`
  # is only read while `oneClick` is off, and electron-builder warns and ignores
  # it otherwise. These two lines are one decision written twice on purpose.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user unless the chosen directory says otherwise, so an ordinary install
  # needs no administrator. Picking a protected path such as Program Files still
  # works: Windows raises its own elevation prompt for it (see `allowElevation`,
  # which is on by default), so the choice of folder stays the user's.
  perMachine: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
